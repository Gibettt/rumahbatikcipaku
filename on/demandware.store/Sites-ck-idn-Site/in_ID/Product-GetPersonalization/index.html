<div class="modal js-product_personalization-modal product_personalization-modal " id="product-personalization" role="dialog">
    <div class="bs-modal_fix product_personalization-modal_layout ">
        <div class="modal-dialog product_personalization-dialog  bs-modal_fix-helper">
            <div class="js-refinements_modal-content modal-content product_personalization-content expanded">
                <button type="button" class="close js-personalize-cancel product_personalization-close_button" data-dismiss="" aria-label="Close" test-modal-close="">
                    <svg class="icon">
                        <use xlink:href="#close-x"></use>
                    </svg>
                </button>
                <div class="modal-body product_personalization-modal_body ">
                    <div class="personalize_modal ">
                        <span class="personalize_modal-title text-uppercase  d-lg-none">PERSONALISED HOT STAMPING</span>
                        
                            <div class="product_image_wrapper">
                                <canvas class="js-personalized-canvas d-none" width="100%" height="100%"></canvas>
                                <img src="null" crossorigin="anonymous" alt="null" class="js-personalized-image product_image_wrapper-image">
                                <span class="js-personalize_modal_image_text product_image_wrapper-text" data-placeholder="" data-text-config="&quot;${{}}&quot;" style="font-size:null;top:null;left:null;width:null;color:"></span>
                            </div>
                        
                        <div class="personalize_modal-content">
                            <span class="personalize_modal-title d-none d-lg-block">PERSONALISED HOT STAMPING</span>
                            <form class="js-personalize_form personalize_form ">
                                <span class="personalize_form-title">Initials</span>
                                <span class="personalize_form-description">Enter up to 3 characters, including initials and up to 1 selected symbol.</span>
                                <div class="form-group c-dynamic_field required personalize_form-initials">
                                    <label class="form-control-label c-form_label--required" for="personalize-initials">
                                        Text/Symbol
                                    </label>
                                    <input type="text"
                                    id="personalize-initials"
                                    class="js-personalize-input personalize_form-input js-initials-value form-control"
                                    placeholder="Initials*"
                                    data-missing-error="Please enter at least 1 character for personalisation"
                                    data-pattern-mismatch="Character is invalid. Please try again."
                                    autocomplete="off"
                                    data-pattern=""
                                    pattern=""
                                    data-default-color=""
                                    data-default-color-title=""
                                    maxlength="3.0"
                                    
                                    />
                                    <input type="hidden" name="personalizeInitials" class="js-initials-hidden-value"/>
                                    <div class="invalid-feedback"></div>
                                    <div class="personalize_form-chars_num">
                                        <span class="js-chars_num">(0/3)</span>
                                    </div>
                                    
                                </div>
                                
                                <ul class="personalize_form-information">
                                    
                                    
                                    
                                </ul>
                                <div class="personalize_form-buttons js-personalize_form-buttons">
                                    <a class="btn btn-block btn-outline-primary js-personalize-cancel">Batal</a>
                                    <button type="submit" class="btn btn-block btn-primary--hover personalize_form-confrim_button js-personalization-submit-button">Confirm</button>
                                </div>
                                <div class="personalize_form-buttons personalize_form-buttons--edit d-none js-personalize_edit_form-buttons">
                                    <div class="personalize_form-edit_buttons">
                                        <a class="btn btn-block btn-outline-primary js-personalize-cancel">Batal</a>
                                        <button type="submit" class="btn btn-block btn-primary--hover personalize_form-confrim_button js-personalization-submit-button">Update</button>
                                    </div>
                                    <a class="js-personalize-remove personalize_form-cancel_link">Remove Personalisation</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
